version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16
        - nvm use 16
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    # CHANGE THIS: Point to the root directory
    baseDirectory: .
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
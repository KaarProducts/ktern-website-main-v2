version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16
        - nvm use 16
        - npm ci --legacy-peer-deps
    build:
      commands:
        # REMOVED the export NODE_OPTIONS line because Node 16 doesn't need it
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*